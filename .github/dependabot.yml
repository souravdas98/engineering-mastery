
version: 2

updates:
  # .NET / NuGet dependencies
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dotnet

  # React / TypeScript dependencies
  - package-ecosystem: npm
    directory: /src/Frontend/engineering-mastery-web
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend

  # GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
