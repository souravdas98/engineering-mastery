
name: Engineering Mastery CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore EngineeringMastery.slnx

      - name: Verify code formatting
        run: dotnet format EngineeringMastery.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build EngineeringMastery.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test EngineeringMastery.slnx --no-build --no-restore --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Frontend/engineering-mastery-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: src/Frontend/engineering-mastery-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Build frontend
        run: npm run build
