
name: Scheduled Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit NuGet dependencies
        run: |
          dotnet restore EngineeringMastery.slnx \
            --force-evaluate \
            -p:NuGetAudit=true \
            -p:NuGetAuditLevel=high \
            -p:TreatWarningsAsErrors=true

      - name: List vulnerable NuGet packages
        if: always()
        run: |
          dotnet list EngineeringMastery.slnx package --vulnerable --include-transitive

  npm-audit:
    name: npm Vulnerability Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Frontend/engineering-mastery-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: src/Frontend/engineering-mastery-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
